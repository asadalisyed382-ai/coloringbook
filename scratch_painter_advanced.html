<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let currentTool = 'brush';
let currentColor = '#e74c3c';
let brushSize = 8;
let drawing = false;
let stampImages = [];
let selectedStampImg = null;
let stampSize = 60;

function initCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.beginPath();
}
initCanvas();

function floodFill(x, y, fillColor) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const targetColor = getColorAtPixel(imageData, x, y);
    const fillRGB = hexToRgb(fillColor);

    if (colorsMatch(targetColor, fillRGB)) return;

    const stack = [{x, y}];
    const visited = new Set();

    while (stack.length) {
        const pixel = stack.pop();
        const px = pixel.x;
        const py = pixel.y;

        if (px < 0 || px >= canvas.width || py < 0 || py >= canvas.height) continue;

        const key = `${px},${py}`;
        if (visited.has(key)) continue;

        const currentPixelColor = getColorAtPixel(imageData, px, py);

        if (!colorsMatch(currentPixelColor, targetColor)) continue;

        visited.add(key);
        setPixel(imageData, px, py, fillRGB);

        stack.push(
            {x: px + 1, y: py},
            {x: px - 1, y: py},
            {x: px, y: py + 1},
            {x: px, y: py - 1}
        );
    }

    ctx.putImageData(imageData, 0, 0);
}

function getColorAtPixel(imageData, x, y) {
    const index = (y * imageData.width + x) * 4;
    return {
        r: imageData.data[index],
        g: imageData.data[index + 1],
        b: imageData.data[index + 2],
        a: imageData.data[index + 3]
    };
}

function setPixel(imageData, x, y, rgb) {
    const index = (y * imageData.width + x) * 4;
    imageData.data[index] = rgb.r;
    imageData.data[index + 1] = rgb.g;
    imageData.data[index + 2] = rgb.b;
    imageData.data[index + 3] = 255;
}

function colorsMatch(c1, c2) {
    return (
        Math.abs(c1.r - c2.r) < 5 &&
        Math.abs(c1.g - c2.g) < 5 &&
        Math.abs(c1.b - c2.b) < 5
    );
}

function hexToRgb(color) {
    if (color.startsWith('rgb')) {
        const nums = color.match(/\d+/g);
        return {
            r: parseInt(nums[0]),
            g: parseInt(nums[1]),
            b: parseInt(nums[2])
        };
    }

    if (color.startsWith('#')) {
        color = color.slice(1);
        return {
            r: parseInt(color.slice(0, 2), 16),
            g: parseInt(color.slice(2, 4), 16),
            b: parseInt(color.slice(4, 6), 16)
        };
    }

    return {r: 0, g: 0, b: 0};
}

function drawBrush(x, y) {
    ctx.fillStyle = currentColor;
    ctx.beginPath();
    ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
    ctx.fill();
}

function placeStamp(x, y) {
    if (!selectedStampImg) {
        document.getElementById('statusMsg').innerText =
            '⚠️ First click a Scratch image in gallery!';
        setTimeout(updateStatusMsg, 1500);
        return;
    }

    const width = stampSize;
    const height = stampSize * (selectedStampImg.height / selectedStampImg.width);

    ctx.drawImage(
        selectedStampImg,
        x - width / 2,
        y - height / 2,
        width,
        height
    );

    document.getElementById('statusMsg').innerText = '📌 Stamped!';
    setTimeout(updateStatusMsg, 800);
}

function updateStatusMsg() {
    if (currentTool === 'brush') {
        document.getElementById('statusMsg').innerHTML = '🖌️ Brush mode';
    } else if (currentTool === 'fill') {
        document.getElementById('statusMsg').innerHTML = '🎨 Fill mode';
    } else {
        document.getElementById('statusMsg').innerHTML = '📌 Stamp mode';
    }
}

function getCanvasPosition(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    let clientX, clientY;

    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    return {
        x: Math.min(Math.max(0, (clientX - rect.left) * scaleX), canvas.width - 1),
        y: Math.min(Math.max(0, (clientY - rect.top) * scaleY), canvas.height - 1)
    };
}

function handleCanvasClick(e) {
    const pos = getCanvasPosition(e);

    if (currentTool === 'fill') {
        floodFill(Math.floor(pos.x), Math.floor(pos.y), currentColor);
    } else if (currentTool === 'stamp') {
        placeStamp(pos.x, pos.y);
    }
}

function handleCanvasMove(e) {
    if (currentTool !== 'brush' || !drawing) return;

    const pos = getCanvasPosition(e);
    drawBrush(pos.x, pos.y);
}

canvas.addEventListener('mousedown', (e) => {
    if (currentTool === 'brush') {
        drawing = true;
        const pos = getCanvasPosition(e);
        drawBrush(pos.x, pos.y);
    } else {
        handleCanvasClick(e);
    }
});

canvas.addEventListener('mousemove', handleCanvasMove);
canvas.addEventListener('mouseup', () => drawing = false);
canvas.addEventListener('mouseleave', () => drawing = false);

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();

    if (currentTool === 'brush') {
        drawing = true;
        const pos = getCanvasPosition(e);
        drawBrush(pos.x, pos.y);
    } else {
        handleCanvasClick(e);
    }
});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    handleCanvasMove(e);
});

canvas.addEventListener('touchend', () => drawing = false);

document.getElementById('brushTool').onclick = () => {
    currentTool = 'brush';
    updateStatusMsg();
    highlightTool('brushTool');
};

document.getElementById('fillTool').onclick = () => {
    currentTool = 'fill';
    updateStatusMsg();
    highlightTool('fillTool');
};

document.getElementById('stampTool').onclick = () => {
    currentTool = 'stamp';
    updateStatusMsg();
    highlightTool('stampTool');
};

function highlightTool(activeId) {
    ['brushTool', 'fillTool', 'stampTool'].forEach(id => {
        document.getElementById(id).classList.remove('active');
    });

    document.getElementById(activeId).classList.add('active');
}

document.querySelectorAll('.color-btn').forEach(btn => {
    btn.onclick = () => {
        currentColor = getComputedStyle(btn).backgroundColor;

        document.querySelectorAll('.color-btn').forEach(b => {
            b.classList.remove('active');
        });

        btn.classList.add('active');
    };
});

document.getElementById('brushSize').oninput = function () {
    brushSize = parseInt(this.value);
    document.getElementById('sizeValue').innerText = brushSize + 'px';
};

document.getElementById('stampSize').oninput = function () {
    stampSize = parseInt(this.value);
    document.getElementById('stampSizeValue').innerText = stampSize + 'px';
};

document.getElementById('clearBtn').onclick = initCanvas;

document.getElementById('saveBtn').onclick = function () {
    const link = document.createElement('a');
    link.download = 'scratch_painting.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
};

const uploadInput = document.getElementById('imageUpload');
const gallery = document.getElementById('gallery');

uploadInput.addEventListener('change', function (event) {
    gallery.innerHTML = '';
    stampImages = [];

    Array.from(event.target.files).forEach(file => {
        const reader = new FileReader();

        reader.onload = function (e) {
            const img = new Image();

            img.onload = function () {
                stampImages.push(img);

                const thumb = document.createElement('img');
                thumb.src = e.target.result;
                thumb.className = 'gallery-img';

                thumb.onclick = function () {
                    selectedStampImg = img;
                    document.getElementById('stampPreviewText').innerHTML =
                        `✅ Ready: ${file.name}`;

                    currentTool = 'stamp';
                    updateStatusMsg();
                    highlightTool('stampTool');
                };

                gallery.appendChild(thumb);
            };

            img.src = e.target.result;
        };

        reader.readAsDataURL(file);
    });
});

updateStatusMsg();
</script>
